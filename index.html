<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수학 출제 · 해설 도구</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

<!-- Firebase (보관함 기기 연동용). 설정을 안 넣으면 자동으로 localStorage로 동작. -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root { --c: #2f4b7c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Noto Sans KR',sans-serif; background:#e8ebf1;
    display:flex; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:720px; background:#fbfcfe;
    background-image:linear-gradient(#0000 0,#0000 23px,#dfe4ee22 24px),linear-gradient(90deg,#0000 0,#0000 23px,#dfe4ee22 24px);
    background-size:24px 24px; border:1px solid #d3d9e4; border-radius:14px;
    box-shadow:0 18px 50px -20px rgba(30,40,70,.35); overflow:hidden; }
  .header { padding:26px 28px 16px; display:flex; justify-content:space-between;
    align-items:flex-start; border-bottom:1px solid #e3e7ef; }
  .kicker { font-size:12px; letter-spacing:2px; color:#8a93a8; font-weight:700; margin-bottom:6px; }
  h1 { font-family:'Gowun Batang',serif; font-size:28px; font-weight:700; color:#22293a; margin:0; line-height:1.1; }
  .subtitle { font-size:13.5px; color:#5f6678; margin:8px 0 0; }
  .dot { width:16px; height:16px; border-radius:50%; margin-top:6px; background:var(--c);
    box-shadow:0 0 0 4px #fff,0 0 0 5px #e3e7ef; }
  .mode { font-size:11px; color:#9aa2b5; margin-top:6px; }
  .tabs { display:flex; gap:8px; padding:14px 28px 4px; flex-wrap:wrap; }
  .tab { font-family:inherit; font-size:14px; font-weight:700; padding:9px 16px; border-radius:999px;
    border:1px solid #d8cfbe; background:transparent; color:#5b5347; cursor:pointer; transition:all .15s; }
  .tab.active { color:#fff; background:var(--c); border-color:var(--c); }
  .body { padding:16px 28px 8px; }
  .panel { display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; flex-direction:column; gap:5px; }
  .rowSplit { display:flex; gap:10px; }
  .col { flex:1; display:flex; flex-direction:column; gap:5px; }
  .colSmall { width:78px; display:flex; flex-direction:column; gap:5px; }
  label.lbl { font-size:12.5px; font-weight:700; color:#6b7385; }
  select, input.txt, textarea { font-family:inherit; font-size:14px; padding:10px 12px; border-radius:9px;
    border:1px solid #ccd3e0; background:#fff; color:#22293a; outline:none; }
  textarea { min-height:110px; resize:vertical; line-height:1.5; padding:12px; }
  .solveBtns { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .attach { font-size:13.5px; padding:9px 14px; border-radius:9px; border:1px solid #ccd3e0;
    background:#fff; color:#3a4257; cursor:pointer; font-family:inherit; }
  .attached { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:#5f6678; }
  .attached img { width:28px; height:28px; object-fit:cover; border-radius:5px; }
  .attached .x { border:none; background:transparent; color:#8a93a8; cursor:pointer; font-size:13px; }
  .action { font-family:inherit; font-size:15px; font-weight:700; color:#fff; border:none; border-radius:10px;
    padding:13px; cursor:pointer; margin-top:4px; background:var(--c); transition:background .15s; }
  .action:disabled { background:#9aa6bd; cursor:default; }
  .resultBox { margin-top:18px; background:#fff; border:1px solid #e3e7ef; border-radius:12px; overflow:hidden; }
  .resultHead { display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    border-bottom:1px solid #eef1f6; background:#f7f9fc; }
  .resultLabel { font-size:12.5px; font-weight:700; letter-spacing:1px; color:var(--c); }
  .headBtns { display:flex; gap:8px; }
  .smallBtn { font-family:inherit; font-size:12.5px; padding:5px 12px; border-radius:7px;
    border:1px solid #ccd3e0; background:#fff; color:#3a4257; cursor:pointer; }
  .resultText, .shelfBody { white-space:pre-wrap; font-size:14px; line-height:1.7; color:#2a3142; }
  .resultText { padding:16px 18px; }
  .shelfEmpty { text-align:center; color:#9aa2b5; font-size:13.5px; line-height:1.7; padding:36px 10px; }
  .shelfItem { background:#fff; border:1px solid #e3e7ef; border-radius:11px; overflow:hidden; margin-bottom:10px; }
  .shelfTop { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; }
  .shelfMeta { min-width:0; flex:1; }
  .shelfLabel { font-size:13.5px; font-weight:700; color:#2a3142; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shelfTime { font-size:11.5px; color:#9aa2b5; margin-top:2px; }
  .shelfActions { display:flex; gap:6px; flex-shrink:0; }
  .shelfBtn { font-family:inherit; font-size:12px; padding:5px 10px; border-radius:7px;
    border:1px solid #ccd3e0; background:#fff; color:#3a4257; cursor:pointer; }
  .shelfBody { padding:0 14px 14px; border-top:1px solid #eef1f6; padding-top:12px; }
  .hidden { display:none; }
  .footer { padding:12px 28px 20px; font-size:12px; color:#9aa2b5; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <div class="kicker">교사용 작업대</div>
      <h1>수학 출제 · 해설 도구</h1>
      <p class="subtitle">문항을 만들고, 학평 문제 풀이를 빠르게 초안 잡아요.</p>
      <div class="mode" id="modeBadge"></div>
    </div>
    <div class="dot"></div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="create">문항 출제</button>
    <button class="tab" data-tab="solve">문제 풀이·해설</button>
    <button class="tab" data-tab="shelf">보관함</button>
  </div>

  <div class="body">
    <!-- 문항 출제 -->
    <div class="panel" id="panel-create">
      <div class="row">
        <label class="lbl">과목/단원</label>
        <select id="subject">
          <option>공통수학1</option><option>공통수학2</option><option selected>대수</option>
          <option>미적분Ⅰ</option><option>미적분Ⅱ</option><option>확률과 통계</option>
          <option>기하</option><option>직접 입력</option>
        </select>
      </div>
      <div class="row hidden" id="customRow">
        <label class="lbl">과목명</label>
        <input class="txt" id="customSubject" placeholder="예: 미적분Ⅰ - 극한" />
      </div>
      <div class="row">
        <label class="lbl">세부 주제</label>
        <input class="txt" id="topic" placeholder="예: 등비수열의 합, 사인법칙 활용 (비워도 됨)" />
      </div>
      <div class="rowSplit">
        <div class="col">
          <label class="lbl">난이도</label>
          <select id="difficulty"><option>하</option><option selected>중</option><option>상</option><option>최상(킬러)</option></select>
        </div>
        <div class="col">
          <label class="lbl">유형</label>
          <select id="qtype"><option selected>객관식(5지선다)</option><option>단답형</option><option>서술형</option></select>
        </div>
        <div class="colSmall">
          <label class="lbl">개수</label>
          <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
      </div>
      <button class="action" id="genBtn">문항 만들기</button>
    </div>

    <!-- 문제 풀이 -->
    <div class="panel hidden" id="panel-solve">
      <label class="lbl">문제 입력 (붙여넣기 또는 사진)</label>
      <textarea id="problem" placeholder="문제 본문을 붙여넣거나, 아래 버튼으로 문제 사진을 올려주세요."></textarea>
      <div class="solveBtns">
        <input type="file" id="fileInput" accept="image/*" class="hidden" />
        <button class="attach" id="attachBtn">📷 문제 사진 올리기</button>
        <span class="attached hidden" id="attachedTag">
          <img id="attachedThumb" alt="첨부" /> 첨부됨
          <button class="x" id="removeImg">✕</button>
        </span>
      </div>
      <button class="action" id="solveBtn">풀이·해설 만들기</button>
    </div>

    <!-- 보관함 -->
    <div class="panel hidden" id="panel-shelf">
      <div id="shelfList"></div>
    </div>

    <!-- 결과 -->
    <div class="resultBox hidden" id="resultBox">
      <div class="resultHead">
        <span class="resultLabel">결과</span>
        <div class="headBtns">
          <button class="smallBtn hidden" id="saveBtn">보관함에 저장</button>
          <button class="smallBtn" id="copyBtn">복사</button>
        </div>
      </div>
      <div class="resultText" id="resultText"></div>
    </div>
  </div>

  <div class="footer">⚠ 수학은 AI가 계산·논리를 틀릴 때가 있어요. 초안으로 쓰되 최종 검산은 직접 해주세요.</div>
</div>

<script>
/* ====================================================================== */
/*  ① Gemini API 키  —  Google AI Studio에서 발급받아 아래에 붙여넣기      */
/*     (무료 등급이면 비용 0원. 키를 안 넣으면 AI 기능만 비활성화됨)        */
/* ====================================================================== */
const GEMINI_API_KEY = "AQ.Ab8RN6IEuMMpCY49mI72bEuhDA9lqaTAW2ueymouaqW_4CTaqQ";
const MODEL = "gemini-2.5-flash";   // 무료 등급 모델. 필요시 gemini-2.5-flash-lite 등으로 변경 가능

/* ====================================================================== */
/*  ② Firebase 설정  —  Firebase 콘솔의 웹앱 설정값을 아래에 붙여넣기      */
/*     (안 넣으면 이 기기 안에서만 저장(localStorage). 넣으면 기기 연동)   */
/* ====================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "여기에_FIREBASE_apiKey",
  authDomain: "여기에_FIREBASE_authDomain",
  projectId: "여기에_FIREBASE_projectId",
  storageBucket: "여기에_FIREBASE_storageBucket",
  messagingSenderId: "여기에_FIREBASE_messagingSenderId",
  appId: "여기에_FIREBASE_appId"
};
/* ====================================================================== */

// ---- 저장소 설정 (Firebase 채워졌으면 Firestore, 아니면 localStorage) ----
const useLocal = FIREBASE_CONFIG.apiKey.indexOf("여기에") === 0;
let db = null;
if (!useLocal) {
  try { firebase.initializeApp(FIREBASE_CONFIG); db = firebase.firestore(); }
  catch (e) { console.error(e); }
}
document.getElementById("modeBadge").textContent =
  useLocal ? "저장: 이 기기 (Firebase 미설정)" : "저장: 클라우드 연동 (Firebase)";

const LS_KEY = "mathToolShelf";

async function listItems() {
  if (useLocal) {
    try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; }
  }
  const snap = await db.collection("solutions").orderBy("createdAt", "desc").get();
  return snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
}
async function saveItem(item) {
  if (useLocal) {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) {}
    arr.unshift(Object.assign({ id: String(Date.now()) }, item));
    localStorage.setItem(LS_KEY, JSON.stringify(arr));
    return;
  }
  await db.collection("solutions").add(
    Object.assign({}, item, { createdAt: firebase.firestore.FieldValue.serverTimestamp() })
  );
}
async function removeItem(id) {
  if (useLocal) {
    let arr = [];
    try { arr = JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) {}
    arr = arr.filter(x => x.id !== id);
    localStorage.setItem(LS_KEY, JSON.stringify(arr));
    return;
  }
  await db.collection("solutions").doc(id).delete();
}

// ---- 시스템 지시문 ----
const GEN_SYSTEM = `너는 대한민국 고등학교 수학 교사를 돕는 '출제 보조'다. 2022 개정 교육과정 기준으로 문항을 만든다.
- 요청한 단원/난이도/유형/개수에 정확히 맞춘다.
- 각 문항마다 본문 → 정답 → 검산 가능한 간단 풀이를 함께 준다.
- 객관식이면 흔한 오개념에서 나오는 매력적인 오답으로 선택지를 설계한다.
- 서술형이면 배점 포함 단계별 채점기준을 제시한다.
- 계산과 논리를 스스로 한 번 더 검산하고, 확신이 낮으면 '※ 검토 필요'를 단다.
- HWP에 붙여넣기 좋게 마크다운 기호는 최소화한 평문으로 쓰고, 수식은 a_n=a_1+(n-1)d, x^2, log_2(8) 처럼 일반 텍스트로. 문항마다 ────── 로 구분한다.`;

const SOLVE_SYSTEM = `너는 대한민국 고등학교 수학 교사를 돕는 '풀이·해설 보조'다.
- 사진으로 문제를 받으면 먼저 문제를 정확히 옮겨 적고 무엇을 구하는지 한 줄로 확인한 뒤 푼다.
- 단계별로 풀되 각 단계의 근거(공식·정리)를 밝힌다.
- 학생들이 자주 하는 오개념·실수 포인트를 따로 짚는다.
- 계산을 스스로 검산하고, 애매하면 '※ 검토 필요'를 명시한다. 절대 틀린 답을 자신 있게 말하지 않는다.
- 마지막에 수업용 설명 포인트 한 줄을 덧붙인다.
- HWP에 붙여넣기 좋게 깔끔한 평문, 수식은 일반 텍스트로.`;

// ---- Gemini 호출 ----
async function callGemini(systemText, parts) {
  if (GEMINI_API_KEY.indexOf("여기에") === 0) {
    alert("먼저 코드 상단에 Gemini API 키를 넣어주세요.");
    return null;
  }
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent?key=" + GEMINI_API_KEY;
  const body = {
    system_instruction: { parts: [{ text: systemText }] },
    contents: [{ role: "user", parts: parts }],
    generationConfig: { maxOutputTokens: 2048, temperature: 0.7 }
  };
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.error) return "오류: " + data.error.message;
    const out = ((data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) || [])
      .map(p => p.text || "").join("\n").trim();
    return out || "응답을 받지 못했어요.";
  } catch (e) {
    return "연결에 문제가 생겼어요. 잠시 후 다시 시도해주세요.";
  }
}

// ---- UI 상태 ----
let pendingImage = null;     // { base64, mime }
let resultMode = null;       // 'create' | 'solve'
let lastLabel = "";
let currentResult = "";

function $(id) { return document.getElementById(id); }

// 탭
const tabs = document.querySelectorAll(".tab");
tabs.forEach(t => t.addEventListener("click", () => {
  tabs.forEach(x => x.classList.remove("active"));
  t.classList.add("active");
  const k = t.dataset.tab;
  $("panel-create").classList.toggle("hidden", k !== "create");
  $("panel-solve").classList.toggle("hidden", k !== "solve");
  $("panel-shelf").classList.toggle("hidden", k !== "shelf");
  if (k !== "shelf") $("resultBox").classList.add("hidden");
  if (k === "shelf") renderShelf();
}));

// 과목 직접 입력 토글
$("subject").addEventListener("change", e => {
  $("customRow").classList.toggle("hidden", e.target.value !== "직접 입력");
});

// 결과 표시
function showResult(text, mode) {
  currentResult = text || "";
  resultMode = mode;
  $("resultText").textContent = currentResult;
  $("resultBox").classList.remove("hidden");
  $("saveBtn").classList.toggle("hidden", mode !== "solve");
  $("saveBtn").textContent = "보관함에 저장";
  $("resultBox").scrollIntoView({ behavior: "smooth", block: "nearest" });
}

// 문항 만들기
$("genBtn").addEventListener("click", async () => {
  const btn = $("genBtn");
  const subj = $("subject").value === "직접 입력" ? $("customSubject").value.trim() : $("subject").value;
  const qtype = $("qtype").value;
  const prompt =
    "다음 조건으로 수학 문항을 만들어줘.\n" +
    "- 과목/단원: " + (subj || "(미지정)") + "\n" +
    "- 세부 주제: " + ($("topic").value.trim() || "(자유)") + "\n" +
    "- 난이도: " + $("difficulty").value + "\n" +
    "- 유형: " + qtype + "\n" +
    "- 개수: " + $("count").value + "개\n\n" +
    "각 문항에 정답과 풀이를 함께 줘." + (qtype === "서술형" ? " 서술형이므로 배점 포함 채점기준도 함께." : "");
  btn.disabled = true; btn.textContent = "만드는 중…";
  const out = await callGemini(GEN_SYSTEM, [{ text: prompt }]);
  btn.disabled = false; btn.textContent = "문항 만들기";
  if (out !== null) showResult(out, "create");
});

// 사진 첨부
$("attachBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", e => {
  const file = e.target.files && e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    const r = String(reader.result);
    pendingImage = { base64: r.split(",")[1], mime: file.type || "image/jpeg" };
    $("attachedThumb").src = r;
    $("attachedTag").classList.remove("hidden");
  };
  reader.readAsDataURL(file);
  e.target.value = "";
});
$("removeImg").addEventListener("click", () => {
  pendingImage = null;
  $("attachedTag").classList.add("hidden");
});

// 풀이 만들기
$("solveBtn").addEventListener("click", async () => {
  const problem = $("problem").value.trim();
  if (!problem && !pendingImage) { alert("문제를 입력하거나 사진을 올려주세요."); return; }
  lastLabel = problem ? problem.replace(/\s+/g, " ").slice(0, 40) : "사진 문제";
  let parts;
  if (pendingImage) {
    parts = [
      { inline_data: { mime_type: pendingImage.mime, data: pendingImage.base64 } },
      { text: problem || "이 문제의 단계별 풀이와 해설을 만들어줘." }
    ];
  } else {
    parts = [{ text: "다음 문제의 단계별 풀이와 해설을 만들어줘.\n\n" + problem }];
  }
  const btn = $("solveBtn");
  btn.disabled = true; btn.textContent = "푸는 중…";
  const out = await callGemini(SOLVE_SYSTEM, parts);
  btn.disabled = false; btn.textContent = "풀이·해설 만들기";
  if (out !== null) showResult(out, "solve");
});

// 복사
$("copyBtn").addEventListener("click", async () => {
  try { await navigator.clipboard.writeText(currentResult); $("copyBtn").textContent = "복사됨 ✓";
    setTimeout(() => $("copyBtn").textContent = "복사", 1500); } catch (e) {}
});

// 보관함 저장
$("saveBtn").addEventListener("click", async () => {
  if (!currentResult) return;
  $("saveBtn").textContent = "저장 중…";
  const now = new Date().toLocaleString("ko-KR", { month: "2-digit", day: "2-digit", hour: "2-digit", minute: "2-digit" });
  try {
    await saveItem({ label: lastLabel || "문제 풀이", result: currentResult, savedAt: now });
    $("saveBtn").textContent = "저장됨 ✓";
    setTimeout(() => $("saveBtn").textContent = "보관함에 저장", 1600);
  } catch (e) {
    $("saveBtn").textContent = "보관함에 저장";
    alert("저장 실패: " + e.message);
  }
});

// 보관함 렌더
async function renderShelf() {
  const wrap = $("shelfList");
  wrap.innerHTML = '<div class="shelfEmpty">불러오는 중…</div>';
  let items = [];
  try { items = await listItems(); } catch (e) { wrap.innerHTML = '<div class="shelfEmpty">불러오기 실패: ' + e.message + '</div>'; return; }
  if (!items.length) {
    wrap.innerHTML = '<div class="shelfEmpty">아직 저장한 풀이가 없어요.<br>풀이·해설 탭에서 결과를 만든 뒤 “보관함에 저장”을 누르면 여기에 쌓여요.</div>';
    return;
  }
  wrap.innerHTML = "";
  items.forEach(it => {
    const card = document.createElement("div");
    card.className = "shelfItem";
    const time = it.savedAt || "";
    card.innerHTML =
      '<div class="shelfTop">' +
        '<div class="shelfMeta"><div class="shelfLabel"></div><div class="shelfTime">' + time + '</div></div>' +
        '<div class="shelfActions">' +
          '<button class="shelfBtn act-open">펼치기</button>' +
          '<button class="shelfBtn act-copy">복사</button>' +
          '<button class="shelfBtn act-del" style="color:#b3433a">삭제</button>' +
        '</div>' +
      '</div>' +
      '<div class="shelfBody hidden"></div>';
    card.querySelector(".shelfLabel").textContent = it.label || "문제 풀이";
    card.querySelector(".shelfBody").textContent = it.result || "";
    card.querySelector(".act-open").addEventListener("click", () => {
      const body = card.querySelector(".shelfBody");
      const open = body.classList.toggle("hidden");
      card.querySelector(".act-open").textContent = open ? "펼치기" : "접기";
    });
    card.querySelector(".act-copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(it.result || ""); } catch (e) {}
    });
    card.querySelector(".act-del").addEventListener("click", async () => {
      if (!confirm("이 항목을 삭제할까요?")) return;
      try { await removeItem(it.id); renderShelf(); } catch (e) { alert("삭제 실패: " + e.message); }
    });
    wrap.appendChild(card);
  });
}
</script>
