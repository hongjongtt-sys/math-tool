<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>수학 출제 · 해설 도구</title>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />

<!-- Firebase (보관함 기기 연동용) -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
  :root { --c: #2f4b7c; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:'Noto Sans KR',sans-serif; background:#e8ebf1;
    display:flex; justify-content:center; padding:24px 16px; }
  .card { width:100%; max-width:720px; background:#fbfcfe;
    background-image:linear-gradient(#0000 0,#0000 23px,#dfe4ee22 24px),linear-gradient(90deg,#0000 0,#0000 23px,#dfe4ee22 24px);
    background-size:24px 24px; border:1px solid #d3d9e4; border-radius:14px;
    box-shadow:0 18px 50px -20px rgba(30,40,70,.35); overflow:hidden; }
  .header { padding:26px 28px 16px; display:flex; justify-content:space-between;
    align-items:flex-start; border-bottom:1px solid #e3e7ef; }
  .kicker { font-size:12px; letter-spacing:2px; color:#8a93a8; font-weight:700; margin-bottom:6px; }
  h1 { font-family:'Gowun Batang',serif; font-size:28px; font-weight:700; color:#22293a; margin:0; line-height:1.1; }
  .subtitle { font-size:13.5px; color:#5f6678; margin:8px 0 0; }
  .mode { font-size:11px; color:#9aa2b5; margin-top:6px; }
  .gear { background:#fff; border:1px solid #d3d9e4; border-radius:9px; padding:7px 11px;
    font-size:15px; cursor:pointer; }
  .settings { background:#f7f9fc; border-bottom:1px solid #e3e7ef; padding:18px 28px; }
  .settings.hidden { display:none; }
  .settings h3 { margin:0 0 4px; font-size:14px; color:#22293a; }
  .settings .desc { font-size:12px; color:#7c869b; margin:0 0 14px; line-height:1.5; }
  .settings label { display:block; font-size:12.5px; font-weight:700; color:#6b7385; margin:10px 0 5px; }
  .settings input, .settings textarea { width:100%; font-family:inherit; font-size:13px; padding:10px 12px;
    border-radius:9px; border:1px solid #ccd3e0; background:#fff; color:#22293a; outline:none; }
  .settings textarea { min-height:120px; resize:vertical; line-height:1.45; }
  .settings .saveRow { display:flex; align-items:center; gap:10px; margin-top:14px; }
  .settings .saveBtn { font-family:inherit; font-size:13.5px; font-weight:700; color:#fff; background:var(--c);
    border:none; border-radius:9px; padding:10px 18px; cursor:pointer; }
  .settings .hint { font-size:11.5px; color:#9aa2b5; }
  .stat { font-size:11.5px; margin-top:6px; }
  .stat.ok { color:#2e7d32; } .stat.no { color:#b3433a; }
  .tabs { display:flex; gap:8px; padding:14px 28px 4px; flex-wrap:wrap; }
  .tab { font-family:inherit; font-size:14px; font-weight:700; padding:9px 16px; border-radius:999px;
    border:1px solid #d8cfbe; background:transparent; color:#5b5347; cursor:pointer; transition:all .15s; }
  .tab.active { color:#fff; background:var(--c); border-color:var(--c); }
  .body { padding:16px 28px 8px; }
  .panel { display:flex; flex-direction:column; gap:12px; }
  .row { display:flex; flex-direction:column; gap:5px; }
  .rowSplit { display:flex; gap:10px; }
  .col { flex:1; display:flex; flex-direction:column; gap:5px; }
  .colSmall { width:78px; display:flex; flex-direction:column; gap:5px; }
  label.lbl { font-size:12.5px; font-weight:700; color:#6b7385; }
  select, input.txt, textarea.prob { font-family:inherit; font-size:14px; padding:10px 12px; border-radius:9px;
    border:1px solid #ccd3e0; background:#fff; color:#22293a; outline:none; }
  textarea.prob { min-height:110px; resize:vertical; line-height:1.5; padding:12px; }
  .solveBtns { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .attach { font-size:13.5px; padding:9px 14px; border-radius:9px; border:1px solid #ccd3e0;
    background:#fff; color:#3a4257; cursor:pointer; font-family:inherit; }
  .attached { display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:#5f6678; }
  .attached img { width:28px; height:28px; object-fit:cover; border-radius:5px; }
  .attached .x { border:none; background:transparent; color:#8a93a8; cursor:pointer; font-size:13px; }
  .action { font-family:inherit; font-size:15px; font-weight:700; color:#fff; border:none; border-radius:10px;
    padding:13px; cursor:pointer; margin-top:4px; background:var(--c); transition:background .15s; }
  .action:disabled { background:#9aa6bd; cursor:default; }
  .resultBox { margin-top:18px; background:#fff; border:1px solid #e3e7ef; border-radius:12px; overflow:hidden; }
  .resultHead { display:flex; justify-content:space-between; align-items:center; padding:10px 14px;
    border-bottom:1px solid #eef1f6; background:#f7f9fc; }
  .resultLabel { font-size:12.5px; font-weight:700; letter-spacing:1px; color:var(--c); }
  .headBtns { display:flex; gap:8px; }
  .smallBtn { font-family:inherit; font-size:12.5px; padding:5px 12px; border-radius:7px;
    border:1px solid #ccd3e0; background:#fff; color:#3a4257; cursor:pointer; }
  .resultText, .shelfBody { white-space:pre-wrap; font-size:14px; line-height:1.7; color:#2a3142; }
  .resultText { padding:16px 18px; max-height:70vh; overflow:auto; }
  .shelfEmpty { text-align:center; color:#9aa2b5; font-size:13.5px; line-height:1.7; padding:36px 10px; }
  .shelfItem { background:#fff; border:1px solid #e3e7ef; border-radius:11px; overflow:hidden; margin-bottom:10px; }
  .shelfTop { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; }
  .shelfMeta { min-width:0; flex:1; }
  .shelfLabel { font-size:13.5px; font-weight:700; color:#2a3142; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .shelfTime { font-size:11.5px; color:#9aa2b5; margin-top:2px; }
  .shelfActions { display:flex; gap:6px; flex-shrink:0; }
  .shelfBtn { font-family:inherit; font-size:12px; padding:5px 10px; border-radius:7px;
    border:1px solid #ccd3e0; background:#fff; color:#3a4257; cursor:pointer; }
  .shelfBody { padding:0 14px 14px; border-top:1px solid #eef1f6; padding-top:12px; }
  .hidden { display:none; }
  .footer { padding:12px 28px 20px; font-size:12px; color:#9aa2b5; line-height:1.5; }
</style>
</head>
<body>
<div class="card">
  <div class="header">
    <div>
      <div class="kicker">교사용 작업대</div>
      <h1>수학 출제 · 해설 도구</h1>
      <p class="subtitle">문항을 만들고, 학평 문제 풀이를 빠르게 초안 잡아요.</p>
      <div class="mode" id="modeBadge"></div>
    </div>
    <button class="gear" id="gearBtn" title="설정">⚙</button>
  </div>

  <!-- 설정 (키·Firebase) : 값은 이 브라우저에만 저장됨 -->
  <div class="settings hidden" id="settings">
    <h3>설정 — 키 입력</h3>
    <p class="desc">여기 입력한 값은 <b>이 브라우저(이 기기)에만</b> 저장돼요. 코드나 GitHub에는 올라가지 않습니다.
      다른 기기(폰 등)에서 쓰려면 그 기기에서도 한 번 입력하면 돼요.</p>

    <label>Gemini API 키</label>
    <input id="setGemini" type="text" placeholder="AIza... (Google AI Studio에서 발급)" />
    <div class="stat" id="statGemini"></div>

    <label>Firebase 설정 (보관함 기기 연동 / 선택)</label>
    <textarea id="setFirebase" placeholder="Firebase 콘솔에서 복사한 firebaseConfig = { ... } 블록을 통째로 붙여넣으세요. (비워두면 이 기기에만 저장됩니다)"></textarea>
    <div class="stat" id="statFirebase"></div>

    <div class="saveRow">
      <button class="saveBtn" id="saveSettings">저장하고 적용</button>
      <span class="hint">저장하면 페이지가 새로고침됩니다.</span>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="create">문항 출제</button>
    <button class="tab" data-tab="solve">문제 풀이·해설</button>
    <button class="tab" data-tab="shelf">보관함</button>
  </div>

  <div class="body">
    <!-- 문항 출제 -->
    <div class="panel" id="panel-create">
      <div class="row">
        <label class="lbl">과목/단원</label>
        <select id="subject">
          <option>공통수학1</option><option>공통수학2</option><option selected>대수</option>
          <option>미적분Ⅰ</option><option>미적분Ⅱ</option><option>확률과 통계</option>
          <option>기하</option><option>직접 입력</option>
        </select>
      </div>
      <div class="row hidden" id="customRow">
        <label class="lbl">과목명</label>
        <input class="txt" id="customSubject" placeholder="예: 미적분Ⅰ - 극한" />
      </div>
      <div class="row">
        <label class="lbl">세부 주제</label>
        <input class="txt" id="topic" placeholder="예: 등비수열의 합, 사인법칙 활용 (비워도 됨)" />
      </div>
      <div class="rowSplit">
        <div class="col">
          <label class="lbl">난이도</label>
          <select id="difficulty"><option>하</option><option selected>중</option><option>상</option><option>최상(킬러)</option></select>
        </div>
        <div class="col">
          <label class="lbl">유형</label>
          <select id="qtype"><option selected>객관식(5지선다)</option><option>단답형</option><option>서술형</option></select>
        </div>
        <div class="colSmall">
          <label class="lbl">개수</label>
          <select id="count"><option>1</option><option selected>2</option><option>3</option><option>4</option><option>5</option></select>
        </div>
      </div>
      <button class="action" id="genBtn">문항 만들기</button>
    </div>

    <!-- 문제 풀이 -->
    <div class="panel hidden" id="panel-solve">
      <label class="lbl">문제 입력 (붙여넣기 또는 사진)</label>
      <textarea class="prob" id="problem" placeholder="문제 본문을 붙여넣거나, 아래 버튼으로 문제 사진을 올려주세요."></textarea>
      <div class="solveBtns">
        <input type="file" id="fileInput" accept="image/*" class="hidden" />
        <button class="attach" id="attachBtn">📷 문제 사진 올리기</button>
        <span class="attached hidden" id="attachedTag">
          <img id="attachedThumb" alt="첨부" /> 첨부됨
          <button class="x" id="removeImg">✕</button>
        </span>
      </div>
      <button class="action" id="solveBtn">풀이·해설 만들기</button>
    </div>

    <!-- 보관함 -->
    <div class="panel hidden" id="panel-shelf">
      <div id="shelfList"></div>
    </div>

    <!-- 결과 -->
    <div class="resultBox hidden" id="resultBox">
      <div class="resultHead">
        <span class="resultLabel">결과</span>
        <div class="headBtns">
          <button class="smallBtn hidden" id="saveBtn">보관함에 저장</button>
          <button class="smallBtn" id="copyBtn">복사</button>
        </div>
      </div>
      <div class="resultText" id="resultText"></div>
    </div>
  </div>

  <div class="footer">⚠ 수학은 AI가 계산·논리를 틀릴 때가 있어요. 초안으로 쓰되 최종 검산은 직접 해주세요. · 수식은 HWP에 바로 붙도록 평문으로 변환됩니다.</div>
</div>

<script>
const MODEL = "gemini-2.5-flash"; // 무료 등급 모델. 필요시 gemini-2.5-flash-lite 등으로 변경 가능

// ── 속도·길이 조절 ───────────────────────────────────────────
// 2.5 Flash는 '사고(thinking)'가 기본 켜짐. 사고 토큰이 출력 한도를 같이 깎아
// 풀이가 중간에 잘리고 느려진다. 아래 두 값으로 조절한다.
const THINKING_BUDGET = 1024;     // 0=사고 끔(가장 빠름) · 숫자↑=정확↑·속도↓ · -1=자동
const MAX_OUTPUT_TOKENS = 32768;  // 출력 길이 한도(넉넉히). 잘림 방지. 높여도 실제 생성한 만큼만 느려짐
const TEMPERATURE = 0.4;          // 낮을수록 계산·답이 일관됨(수학엔 0.2~0.4 권장) · 높을수록 다양

// ---- 설정값을 localStorage에서 읽기 (코드에 비밀값 없음) ----
const LS_GEMINI = "mt_geminiKey";
const LS_FB = "mt_firebaseConfig";
const LS_SHELF = "mt_shelf";

function getGeminiKey() { try { return localStorage.getItem(LS_GEMINI) || ""; } catch (e) { return ""; } }
function getFirebaseConfig() {
  try { const s = localStorage.getItem(LS_FB); return s ? JSON.parse(s) : null; } catch (e) { return null; }
}

// 붙여넣은 firebaseConfig 텍스트에서 값 추출
function parseFirebaseConfig(text) {
  const keys = ["apiKey","authDomain","projectId","storageBucket","messagingSenderId","appId"];
  const cfg = {};
  keys.forEach(k => {
    const m = text.match(new RegExp(k + "\\s*:\\s*[\"']([^\"']+)[\"']"));
    if (m) cfg[k] = m[1];
  });
  return (cfg.apiKey && cfg.projectId) ? cfg : null;
}

// ============================================================
//  수식 평문화 (HWP 붙여넣기용)
//  - 모델이 지시를 어기고 LaTeX/마크다운을 흘려도 여기서 평문으로 강제 변환
// ============================================================
function toPlainMath(s) {
  if (!s) return s;
  let t = s;

  // 0) LaTeX 줄바꿈
  t = t.replace(/\\\\/g, "\n");

  // 1) 수식 구분자 제거(내용만 남김)
  t = t.replace(/\$\$([\s\S]*?)\$\$/g, "$1");
  t = t.replace(/\\\[([\s\S]*?)\\\]/g, "$1");
  t = t.replace(/\\\(([\s\S]*?)\\\)/g, "$1");
  t = t.replace(/\$([^$\n]*?)\$/g, "$1");

  // 2) 90^\circ → 90°  (도 기호: 일반 \circ 변환보다 먼저)
  t = t.replace(/\^\s*\{?\s*\\circ\s*\}?/g, "°");

  // 3) 래퍼류는 안쪽 내용만 남김
  t = t.replace(/\\(?:text|mathrm|mathbf|mathit|mathsf|mathcal|mathbb|operatorname|boxed|overline|underline|overrightarrow|overleftarrow|hat|widehat|bar|vec|tilde|dot|ddot)\s*\{([^{}]*)\}/g, "$1");

  // 4) \left \right 제거
  t = t.replace(/\\left\s*/g, "").replace(/\\right\s*/g, "");

  // 5) 조합 \binom{n}{k} → C(n, k)
  t = t.replace(/\\(?:d|t)?binom\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, "C($1, $2)");

  // 6) 분수 \frac{a}{b} → (a)/(b)  (중첩 대비 반복)
  for (let i = 0; i < 6; i++) {
    const before = t;
    t = t.replace(/\\[dt]?frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, function (m, a, b) {
      const A = /^[A-Za-z0-9π]+$/.test(a) ? a : "(" + a + ")";
      const B = /^[A-Za-z0-9π]+$/.test(b) ? b : "(" + b + ")";
      return A + "/" + B;
    });
    if (t === before) break;
  }

  // 7) 근호 \sqrt
  t = t.replace(/\\sqrt\s*\[([^\]]*)\]\s*\{([^{}]*)\}/g, "($2)^(1/$1)");
  for (let i = 0; i < 4; i++) {
    const before = t;
    t = t.replace(/\\sqrt\s*\{([^{}]*)\}/g, function (m, a) {
      return /^[A-Za-z0-9π]+$/.test(a) ? "√" + a : "√(" + a + ")";
    });
    if (t === before) break;
  }

  // 8) 함수: 백슬래시만 제거
  ["arcsin","arccos","arctan","sinh","cosh","tanh","sin","cos","tan","cot","sec","csc",
   "log","ln","exp","limsup","liminf","lim","max","min","sup","inf","det","gcd","lcm","mod"]
    .forEach(function (f) { t = t.replace(new RegExp("\\\\" + f + "\\b", "g"), f); });

  // 9) 그리스문자·연산자·관계기호 → 유니코드
  const MAP = {
    alpha:"α",beta:"β",gamma:"γ",delta:"δ",epsilon:"ε",varepsilon:"ε",zeta:"ζ",eta:"η",
    theta:"θ",vartheta:"θ",iota:"ι",kappa:"κ",lambda:"λ",mu:"μ",nu:"ν",xi:"ξ",pi:"π",
    rho:"ρ",sigma:"σ",tau:"τ",upsilon:"υ",phi:"φ",varphi:"φ",chi:"χ",psi:"ψ",omega:"ω",
    Gamma:"Γ",Delta:"Δ",Theta:"Θ",Lambda:"Λ",Xi:"Ξ",Pi:"Π",Sigma:"Σ",Phi:"Φ",Psi:"Ψ",Omega:"Ω",
    times:"×",div:"÷",cdot:"·",pm:"±",mp:"∓",
    leqslant:"≤",geqslant:"≥",leq:"≤",le:"≤",geq:"≥",ge:"≥",neq:"≠",ne:"≠",
    approx:"≈",equiv:"≡",sim:"∼",cong:"≅",propto:"∝",ll:"≪",gg:"≫",
    infty:"∞",partial:"∂",nabla:"∇",
    sum:"Σ",prod:"∏",int:"∫",oint:"∮",
    longrightarrow:"→",rightarrow:"→",leftrightarrow:"↔",Leftrightarrow:"⇔",Rightarrow:"⇒",
    mapsto:"↦",implies:"⇒",iff:"⇔",to:"→",
    in:"∈",notin:"∉",ni:"∋",subseteq:"⊆",subset:"⊂",supseteq:"⊇",supset:"⊃",
    cup:"∪",cap:"∩",emptyset:"∅",varnothing:"∅",forall:"∀",exists:"∃",neg:"¬",
    angle:"∠",triangle:"△",perp:"⊥",parallel:"∥",mid:"|",
    circ:"∘",deg:"°",degree:"°",prime:"′",
    cdots:"⋯",ldots:"…",dots:"…",vdots:"⋮"
  };
  Object.keys(MAP).forEach(function (k) {
    t = t.replace(new RegExp("\\\\" + k + "\\b", "g"), MAP[k]);
  });

  // 10) 간격 명령
  t = t.replace(/\\quad/g, "  ").replace(/\\qquad/g, "    ").replace(/\\[,;:! ]/g, " ");

  // 11) 위/아래 첨자 → 유니코드(가능할 때), 아니면 ^( )·_( )
  const SUP = {"0":"⁰","1":"¹","2":"²","3":"³","4":"⁴","5":"⁵","6":"⁶","7":"⁷","8":"⁸","9":"⁹",
    "+":"⁺","-":"⁻","=":"⁼","(":"⁽",")":"⁾","n":"ⁿ","i":"ⁱ"};
  const SUB = {"0":"₀","1":"₁","2":"₂","3":"₃","4":"₄","5":"₅","6":"₆","7":"₇","8":"₈","9":"₉",
    "+":"₊","-":"₋","=":"₌","(":"₍",")":"₎","a":"ₐ","e":"ₑ","o":"ₒ","x":"ₓ","n":"ₙ","i":"ᵢ"};
  function uni(str, m) { let o = ""; for (const ch of str) { if (m[ch] === undefined) return null; o += m[ch]; } return o; }

  t = t.replace(/\^\{([^{}]*)\}/g, function (mm, a) { const u = uni(a, SUP); return u !== null ? u : "^(" + a + ")"; });
  t = t.replace(/_\{([^{}]*)\}/g,  function (mm, a) { const u = uni(a, SUB); return u !== null ? u : "_(" + a + ")"; });
  t = t.replace(/\^([0-9A-Za-z+\-])/g, function (mm, a) { const u = uni(a, SUP); return u !== null ? u : "^" + a; });
  t = t.replace(/_([0-9A-Za-z+\-])/g,  function (mm, a) { const u = uni(a, SUB); return u !== null ? u : "_" + a; });

  // 12) 이스케이프된 특수문자 (\% \& \# 등)
  t = t.replace(/\\([%&#$])/g, "$1");

  // 13) 남은 미지의 백슬래시 명령은 백슬래시만 제거 (잔여 LaTeX 방지)
  t = t.replace(/\\([a-zA-Z]+)/g, "$1");

  // 14) 마크다운 잔재 정리 (HWP 평문화)
  t = t.replace(/\*\*([^*]+)\*\*/g, "$1");   // **굵게**
  t = t.replace(/`([^`]+)`/g, "$1");         // `인라인 코드`
  t = t.replace(/^#{1,6}\s+/gm, "");          // # 제목

  // 15) 마무리: 과한 빈 줄·줄 끝 공백 정리
  t = t.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n");

  return t.trim();
}

// ---- Gemini 호출 ----
async function callGemini(systemText, parts) {
  const key = getGeminiKey();
  if (!key) { alert("먼저 오른쪽 위 ⚙ 설정에서 Gemini API 키를 입력해주세요."); openSettings(); return null; }
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + MODEL + ":generateContent?key=" + key;
  const body = {
    system_instruction: { parts: [{ text: systemText }] },
    contents: [{ role: "user", parts: parts }],
    generationConfig: {
      maxOutputTokens: MAX_OUTPUT_TOKENS,
      temperature: TEMPERATURE,
      thinkingConfig: { thinkingBudget: THINKING_BUDGET } // ← 사고량 제한(잘림·느림 방지)
    }
  };
  try {
    const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
    const data = await res.json();
    if (data.error) return "오류: " + data.error.message;
    const cand = data.candidates && data.candidates[0];
    const out = ((cand && cand.content && cand.content.parts) || [])
      .map(p => p.text || "").join("\n").trim();
    const truncated = cand && cand.finishReason === "MAX_TOKENS";
    if (!out) {
      // 사고가 출력 한도를 다 먹어 본문이 비는 경우
      return truncated
        ? "사고(thinking)가 길어 본문이 비었어요. 코드 위쪽 THINKING_BUDGET을 0이나 더 작은 값으로 줄이거나, 개수를 줄여 다시 시도해주세요."
        : "응답을 받지 못했어요.";
    }
    let result = toPlainMath(out); // ← HWP 평문화 후처리
    if (truncated) {
      result += "\n\n※ 출력 한도에 도달해 뒷부분이 잘렸을 수 있어요. 개수를 줄이거나, 코드 위쪽 MAX_OUTPUT_TOKENS를 올려 다시 시도해주세요.";
    }
    return result;
  } catch (e) { return "연결에 문제가 생겼어요. 잠시 후 다시 시도해주세요."; }
}

  let items = [];
  try { items = await listItems(); } catch (e) { wrap.innerHTML = '<div class="shelfEmpty">불러오기 실패: ' + e.message + '</div>'; return; }
  if (!items.length) {
    wrap.innerHTML = '<div class="shelfEmpty">아직 저장한 풀이가 없어요.<br>풀이·해설 탭에서 결과를 만든 뒤 “보관함에 저장”을 누르면 여기에 쌓여요.</div>';
    return;
  }
  wrap.innerHTML = "";
  items.forEach(it => {
    const card = document.createElement("div");
    card.className = "shelfItem";
    card.innerHTML =
      '<div class="shelfTop"><div class="shelfMeta"><div class="shelfLabel"></div>' +
      '<div class="shelfTime">' + (it.savedAt || "") + '</div></div>' +
      '<div class="shelfActions"><button class="shelfBtn act-open">펼치기</button>' +
      '<button class="shelfBtn act-copy">복사</button>' +
      '<button class="shelfBtn act-del" style="color:#b3433a">삭제</button></div></div>' +
      '<div class="shelfBody hidden"></div>';
    card.querySelector(".shelfLabel").textContent = it.label || "문제 풀이";
    card.querySelector(".shelfBody").textContent = it.result || "";
    card.querySelector(".act-open").addEventListener("click", () => {
      const body = card.querySelector(".shelfBody");
      const open = body.classList.toggle("hidden");
      card.querySelector(".act-open").textContent = open ? "펼치기" : "접기";
    });
    card.querySelector(".act-copy").addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(it.result || ""); } catch (e) {} });
    card.querySelector(".act-del").addEventListener("click", async () => {
      if (!confirm("이 항목을 삭제할까요?")) return;
      try { await removeItem(it.id); renderShelf(); } catch (e) { alert("삭제 실패: " + e.message); } });
    wrap.appendChild(card);
  });
}
</script>
</body>
</html>
